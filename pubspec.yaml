name: money_diary
description: "포켓가계부 (Pocket Ledger) - 가계부 앱"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  easy_localization: ^3.0.8

  # Firebase
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2

  pedantic_mono: ^1.36.0
  marionette_flutter: ^0.5.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.2
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  marionette_mcp: ^0.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/translations/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F1F2EC"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
