# Dart 포맷 검사 워크플로우
#
# 포맷이 어긋난 파일이 있으면 실패합니다. 고쳐서 대신 커밋해 주지는 않습니다.
# 예전에는 PR 브랜치를 이름으로 체크아웃해 포맷한 뒤 그 브랜치에 푸시했는데,
# PR 을 머지하며 브랜치를 지우면 체크아웃할 브랜치가 없어 매번 실패했습니다.
# 푸시된 커밋을 기준으로 검사하면 브랜치가 지워져도 영향이 없습니다.
name: 포맷 검사

on: [push]

jobs:
  flutter_format:
    name: Dart 포맷 검사
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"

      # 의존성을 받기 전에 포맷하면 analysis_options 를 읽지 못해 결과가 달라집니다.
      - name: 의존성 패키지 설치
        run: flutter pub get

      # 빌드 산출물까지 긁지 않도록 git 이 추적하는 .dart 파일만 검사합니다.
      - name: 포맷 검사
        run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed
